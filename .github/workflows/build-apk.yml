name: Construire TaoConnect APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Vérifier et compiler l’APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Installer le SDK Android 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Contrôler et compiler TaoConnect
        run: gradle :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Préparer le fichier installable
        run: cp app/build/outputs/apk/debug/app-debug.apk TaoConnect-v0.2-debug.apk

      - name: Rendre l’APK téléchargeable
        uses: actions/upload-artifact@v7
        with:
          name: TaoConnect-v0.2-APK
          path: TaoConnect-v0.2-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
